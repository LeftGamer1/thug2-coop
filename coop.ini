[coop]
; the host's IP address (the friend's PC when you join; LAN, VPN or public IP with port forwarded)
host_address=127.0.0.1
port=5153
; your name over your skater for the friend (15 letters at most; empty: the game's)
name=
; 1: a goal one player takes from an NPC starts for both and is won once both have done it; 0: won by whoever does it
shared_goals=1
; 1: the skaters knock each other down when they collide; 0: they ride through each other (the default)
player_collision=0

[display]
; borderless: a window over the whole screen (the default: Alt+Tab works, the game keeps running
; behind other windows); fullscreen: the game's own full screen; windowed: a window with a frame
mode=borderless
; the picture's size: desktop (your monitor's, the default), or e.g. 1920x1080, 2560x1440, 3840x2160, 1280x720.
; borderless and windowed stretch it over the window; in fullscreen your monitor must support it.
; launcher: the one picked in Launcher.exe
resolution=desktop

[keys]
; keys: F1-F24, A-Z, 0-9, Num0-Num9, Insert, Delete, Home, End, PageUp, PageDown, Pause, ScrollLock;
; with Ctrl+ / Shift+ / Alt+ in front if you like (Ctrl+F10); none: no key. Avoid F1-F4 (taunts) and Enter (chat)
; host co-op (open the lobby in the main menu, or host from a story level)
host=F10
; join the host
join=F11
; teleport to your friend (also: unfreezes you if a camera of your friend's left you standing still)
teleport=F12
; leave co-op: press it twice. The friend goes back to the main menu; the host keeps playing alone
leave=F9

[gamepad]
; 1: XInput gamepads (Xbox; PlayStation and others through Steam Input or DS4Windows): A ollie, X flip, B grab,
; Y grind, LB / RB spin, LT nollie, RT revert, left stick / d-pad move, right stick camera, Back view, Start pause
enabled=1

[debug]
; for debugging, leave it alone
log_printf=0
multi_instance=0
always_active=0
