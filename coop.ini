[coop]
; the host's IP address (the friend's PC when you join; LAN, VPN or public IP with port forwarded)
host_address=127.0.0.1
port=5153
; your name over your skater for the friend (15 letters at most; empty: the game's)
name=
; 1: a goal one player takes from an NPC starts for both and is won once both have done it; 0: won by whoever does it
shared_goals=1
; 1: the skaters knock each other down when they collide; 0: they ride through each other (the default)
player_collision=0

[display]
; the game's resolution, e.g. 1920x1080, 2560x1440, 1280x720 (your monitor must support it in full screen);
; launcher: the one picked in Launcher.exe
resolution=1920x1080

[keys]
; keys: F1-F24, A-Z, 0-9, Num0-Num9, Insert, Delete, Home, End, PageUp, PageDown, Pause, ScrollLock;
; with Ctrl+ / Shift+ / Alt+ in front if you like (Ctrl+F10); none: no key. Avoid F1-F4 (taunts) and Enter (chat)
; host co-op (open the lobby in the main menu, or host from a story level)
host=F10
; join the host
join=F11
; teleport to your friend
teleport=F12

[debug]
; windowed=1: the game in a window of the resolution above (helps if it crashes on the splash screen)
log_printf=0
windowed=0
multi_instance=0
always_active=0
